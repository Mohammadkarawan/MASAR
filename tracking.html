<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تتبع الشحنة | مسار</title>

<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background: #f5f7fa;
}

header {
background: #111827;
color: white;
padding: 25px;
text-align: center;
}

header h1 {
margin: 0;
font-size: 32px;
}

.container {
max-width: 600px;
margin: 60px auto;
background: white;
padding: 35px;
border-radius: 12px;
box-shadow: 0 4px 15px rgba(0,0,0,0.08);
text-align: center;
}

h2 {
margin-bottom: 15px;
}

p {
color: #555;
}

input {
width: 100%;
box-sizing: border-box;
padding: 15px;
margin-top: 20px;

color: white;

button:hover {

<body>

<header>

</header>

>
