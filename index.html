<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مسار | MASAR</title>

<style>
* {
box-sizing: border-box;
}

html {
scroll-behavior: smooth;
}

body {
margin: 0;
font-family: Arial, Tahoma, sans-serif;
background: #f5f7fa;
color: #10233d;
}

/* ===== Header ===== */

header {
height: 105px;
background: #ffffff;
display: flex;
align-items: center;
justify-content: space-between;
padding: 12px 6%;
box-shadow: 0 2px 12px rgba(0,0,0,0.06);
position: relative;
z-index: 10;
}

/* الشعار - يظهر الشعار واسم مسار فقط */
.logo-box {
width: 145px;
height: 82px;
overflow: hidden;
display: flex;
align-items: flex-start;
justify-content: center;
}

.logo-box img {
width: 145px;
height: 145px;
object-fit: cover;
object-position: center top;
display: block;
}

.login-btn {
background: #b77a18;
color: white;
text-decoration: none;
padding: 14px 25px;
border-radius: 12px;
font-size: 19px;
font-weight: bold;
transition: 0.2s;
}

.login-btn:hover {
background: #9d6611;
transform: translateY(-1px);
}

/* ===== Hero ===== */

.hero {
min-height: 650px;
position: relative;
overflow: hidden;
padding: 100px 6% 70px;
display: flex;
align-items: center;
justify-content: center;
background:
radial-gradient(
circle at 20% 35%,
#f2eadc 0%,
#f8f5ef 42%,
#ffffff 75%
);
}

.hero::before {
content: "";
position: absolute;
width: 780px;
height: 780px;
background: #f2ede3;
border-radius: 50%;
left: -300px;
top: -100px;
opacity: 0.8;
}

.hero-content {
position: relative;
z-index: 2;
width: 100%;
max-width: 1100px;
text-align: center;
}

.hero-title {
margin: 0;
font-size: clamp(38px, 6vw, 72px);
font-weight: 800;
line-height: 1.25;
color: #102f50;
}

.hero-title .gold {
color: #b77a18;
}

.hero-text {
margin: 25px auto 40px;
max-width: 850px;
font-size: clamp(20px, 3vw, 29px);
line-height: 1.7;
color: #173553;
}

/* ===== Buttons ===== */

.hero-buttons {
display: flex;
justify-content: center;
gap: 20px;
flex-wrap: wrap;
}

.main-btn {
width: 320px;
min-height: 82px;
border-radius: 18px;
display: flex;
align-items: center;
justify-content: center;
gap: 12px;
text-decoration: none;
font-size: 27px;
font-weight: bold;
transition: 0.2s;
}

.send-btn {
background: #c08721;
color: white;
}

.track-btn {
background: #123554;
color: white;
}

.main-btn:hover {
transform: translateY(-3px);
box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

.icon {
font-size: 30px;
}

/* ===== Features ===== */

.features {
position: relative;
z-index: 3;
max-width: 1050px;
margin: -10px auto 80px;
padding: 0 25px;
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 0;
}

.feature {
min-height: 125px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
text-align: center;
border-left: 2px solid #c89a4b;
padding: 10px;
}

.feature:last-child {
border-left: none;
}

.feature-icon {
font-size: 43px;
margin-bottom: 10px;
}

.feature-title {
font-size: 21px;
font-weight: bold;
color: #173553;
}

/* ===== Footer ===== */

footer {
background: #102f50;
color: white;
text-align: center;
padding: 30px 15px;
}

footer h3 {
margin: 0 0 10px;
font-size: 25px;
}

footer p {
margin: 5px 0;
color: #e9edf2;
}

/* ===== Mobile ===== */

@media (max-width: 700px) {

header {
height: 92px;
padding: 8px 20px;
}

.logo-box {
width: 115px;
height: 68px;
}

.logo-box img {
width: 115px;
height: 115px;
}

.login-btn {
padding: 11px 18px;
font-size: 17px;
border-radius: 10px;
}

.hero {
min-height: 650px;
padding: 75px 20px 55px;
}

.hero::before {
width: 650px;
height: 650px;
left: -270px;
top: 20px;
}

.hero-title {
font-size: 40px;
line-height: 1.35;
}

.hero-text {
font-size: 21px;
line-height: 1.7;
margin: 22px auto 30px;
}

.hero-buttons {
flex-direction: row;
flex-wrap: nowrap;
gap: 12px;
}

.main-btn {
width: 50%;
min-height: 75px;
font-size: 20px;
border-radius: 15px;
padding: 10px;
}

.icon {
font-size: 23px;
}

.features {
grid-template-columns: repeat(4, 1fr);
padding: 0 10px;
margin: 0 auto 60px;
}

.feature {
min-height: 105px;
padding: 5px;
border-left: 1px solid #c89a4b;
}

.feature-icon {
font-size: 28px;
margin-bottom: 7px;
}

.feature-title {
font-size: 14px;
}

footer {
padding: 25px 10px;
}

footer h3 {
font-size: 20px;
}

footer p {
font-size: 13px;
}
}
</style>
</head>

<body>

<!-- ===== Header ===== -->

<header>

<a href="login.html" class="login-btn">
تسجيل الدخول
</a>

<div class="logo-box">
<img src="masar-logo-full-details.png" alt="مسار MASAR">
</div>

</header>


<!-- ===== Hero ===== -->

<main>

<section class="hero">

<div class="hero-content">

<h1 class="hero-title">
مسارك الآمن
<span class="gold">بين كل المدن</span>
</h1>

<p class="hero-text">
خدمة شحن وتوصيل موثوقة وسريعة عبر شبكة مراكز مسار
</p>

<div class="hero-buttons">

<a href="tracking.html" class="main-btn track-btn">
<span class="icon">🔍</span>
تتبع شحنة
</a>

<a href="send.html" class="main-btn send-btn">
<span class="icon">📦</span>
إرسال شحنة
</a>

</div>

</div>

</section>


<!-- ===== Features ===== -->

<section class="features">

<div class="feature">
<div class="feature-icon">🛡️</div>
<div class="feature-title">أمان</div>
</div>

<div class="feature">
<div class="feature-icon">⚡</div>
<div class="feature-title">سرعة</div>
</div>

<div class="feature">
<div class="feature-icon">📍</div>
<div class="feature-title">تتبع مباشر</div>
</div>

<div class="feature">
<div class="feature-icon">📦</div>
<div class="feature-title">لكل المدن</div>
</div>

</section>

</main>


<!-- ===== Footer ===== -->

<footer>

<h3>مسار | MASAR</h3>

<p>
شحن · توصيل · بين مدينتك
</p>

<p>
© 2026 MASAR - جميع الحقوق محفوظة
</p>

</footer>

</body>
</html>
